name: image-editor-ci

on:
  pull_request:
    paths: ['image-editor/**', '.github/workflows/image-editor-ci.yml']
  push:
    branches: [master, main, 'claude/**']
    paths: ['image-editor/**', '.github/workflows/image-editor-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-editor-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: image-editor/app

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: that image is now 26.04, which Playwright 1.56 cannot install browsers on.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: image-editor/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: image-editor/app/.nvmrc
          cache: pnpm
          cache-dependency-path: image-editor/app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit tests (engine core, codec host with real sharp, main process)
        run: pnpm test:coverage
      - name: Install Chromium for GPU conformance tests
        run: pnpm exec playwright install chromium
      - name: GPU conformance and browser APIs (shaders vs CPU reference, OPFS scratch file; headless Chromium)
        run: pnpm test:gpu
      - name: Golden images (blend modes, adjustments, filters vs the baselines in test/golden)
        run: pnpm test:golden
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-editor-golden-diff-${{ matrix.os }}
          path: image-editor/app/test/golden/__diff__/
          if-no-files-found: ignore
      - run: pnpm build

  e2e:
    name: e2e (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: that image is now 26.04, which Playwright 1.56 cannot install browsers on.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: image-editor/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: image-editor/app/.nvmrc
          cache: pnpm
          cache-dependency-path: image-editor/app/pnpm-lock.yaml
      - name: Allow Chromium's sandbox on Ubuntu 24.04 (AppArmor restricts unprivileged user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The image pipes core dumps to a collector; a piped dump of a crashed renderer streams its whole
      # reserved address space (V8 cage, WASM guard regions: tens of GB), so the process is not reaped for
      # minutes and the crash-report E2E never sees it go. A plain pattern honours `ulimit -c 0`: no dump.
      - name: Don't dump cores of crashed test processes
        if: runner.os == 'Linux'
        run: |
          echo "core_pattern was: $(cat /proc/sys/kernel/core_pattern); ulimit -c: $(ulimit -c)"
          sudo sysctl -w kernel.core_pattern=core
      - run: pnpm install --frozen-lockfile
      - name: Build and package (electron-builder --dir)
        run: pnpm pack:dir
      - name: E2E against the built app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then ulimit -c 0; xvfb-run -a pnpm exec playwright test; else pnpm exec playwright test; fi
      - name: E2E against the packaged app
        shell: bash
        env:
          E2E_TARGET: packaged
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then ulimit -c 0; xvfb-run -a pnpm exec playwright test; else pnpm exec playwright test; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-editor-e2e-${{ matrix.os }}
          path: |
            image-editor/app/test-results/
            image-editor/app/playwright-report/
          retention-days: 14
