name: image-editor-release

# Installers and update manifests for ImageEditor (docs/08 §1, ADR-0010).
# - Tag `image-editor-v<version>` (matching app/package.json): signed builds on all 3 OSes, then a DRAFT GitHub
#   release with every installer, the latest*.yml manifests, blockmaps and SHA256SUMS. A maintainer publishes it
#   after the release QA checklist (docs/07 §8). Updaters ignore drafts, so nothing is offered before that.
# - Pull requests that touch this file or the packaging config: the same builds unsigned, as a dry run; nothing
#   is published.
on:
  push:
    tags: ['image-editor-v*']
  pull_request:
    paths:
      - '.github/workflows/image-editor-release.yml'
      - 'image-editor/app/electron-builder.yml'
      - 'image-editor/app/scripts/check-packaged.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-editor-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: image-editor/app

env:
  # Signed builds are required for a tag; PRs and manual runs build unsigned.
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One NSIS installer for x64 and arm64: electron-updater's Windows updater does not choose by arch.
          - { name: windows, os: windows-latest, args: --win --x64 --arm64 }
          # Both archs in one run, so latest-mac.yml lists both zips. sharp prebuilds are per arch (no universal).
          - { name: macos, os: macos-latest, args: --mac --x64 --arm64 }
          # Separate manifests per arch (latest-linux.yml, latest-linux-arm64.yml).
          - { name: linux, os: ubuntu-24.04, args: --linux --x64 --arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: image-editor/app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: image-editor/app/.nvmrc
          cache: pnpm
          cache-dependency-path: image-editor/app/pnpm-lock.yaml

      - name: The tag matches the app version
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "image-editor-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1
          fi

      - name: Signing secrets are present for a release
        shell: bash
        env:
          WIN_READY: ${{ secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != '' }}
          MAC_READY: ${{ secrets.CSC_LINK != '' && secrets.APPLE_API_KEY != '' }}
        run: |
          # Only a tag build signs: pull-request code never gets near the signing credentials.
          if [ "$RELEASE" != "true" ]; then
            echo "::notice::Dry run: building $RUNNER_OS unsigned"; echo "SIGN=false" >> "$GITHUB_ENV"; exit 0
          fi
          case "$RUNNER_OS" in
            Windows) ready=$WIN_READY ;;
            macOS) ready=$MAC_READY ;;
            *) ready=true ;; # Linux packages are not code-signed; checksums are published.
          esac
          if [ "$ready" != "true" ]; then echo "::error::Signing secrets for $RUNNER_OS are missing"; exit 1; fi
          echo "SIGN=true" >> "$GITHUB_ENV"

      # sharp's native binaries are per platform and arch: fetch both archs' prebuilds for this OS (docs/08 §2).
      - name: Install dependencies for x64 and arm64
        shell: bash
        run: |
          printf 'supportedArchitectures:\n  os: [current]\n  cpu: [x64, arm64]\n  libc: [current]\n' > pnpm-workspace.yaml
          pnpm install --frozen-lockfile
      - name: rpm tooling
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build the app
        env:
          # Opt-in crash reports (ADR-0009): tag builds only, so dry-run builds never send anything.
          MAIN_VITE_CRASH_REPORT_DSN: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.CRASH_REPORT_DSN || '' }}
        run: pnpm build

      # Secrets below are passed on tag builds only (empty otherwise), so pull-request code never sees them.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.AZURE_CLIENT_SECRET || '' }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          PUBLISHER: ${{ vars.WIN_PUBLISHER_NAME }}
        run: |
          sign=()
          if [ "$SIGN" = "true" ]; then
            # Azure Artifact (Trusted) Signing. The publisher name also goes into app-update.yml, so updates
            # are only installed when the installer carries the same publisher.
            sign=(-c.win.azureSignOptions.endpoint="$ENDPOINT" -c.win.azureSignOptions.codeSigningAccountName="$ACCOUNT"
                  -c.win.azureSignOptions.certificateProfileName="$PROFILE" -c.win.azureSignOptions.publisherName="$PUBLISHER")
          fi
          pnpm exec electron-builder ${{ matrix.args }} --publish never "${sign[@]}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_CONTENT: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(github.ref, 'refs/tags/image-editor-v') && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [ "$SIGN" = "true" ]; then
            # Developer ID signing (hardened runtime, the libvips dylibs too) and notarization with an App Store
            # Connect API key; electron-builder staples the ticket.
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
            pnpm exec electron-builder ${{ matrix.args }} --publish never -c.mac.notarize=true
          else
            # Unsigned: no keychain lookup, no notarization. Such a build cannot auto-update (Squirrel.Mac).
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder ${{ matrix.args }} --publish never -c.mac.notarize=false
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Every build bundles its own sharp binaries
        run: node scripts/check-packaged.mjs dist

      # Post-package smoke test on the native arch: codec-host starts and decodes a fixture, and the security
      # baseline holds, in the build that ships (signed, all archs).
      - name: Smoke test the packaged app
        shell: bash
        env:
          E2E_TARGET: packaged
        # Playwright attaches to Electron's own Chromium over CDP: no browser download.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            xvfb-run -a pnpm exec playwright test e2e/editor.spec.ts -g "phone photo|security baseline"
          else
            pnpm exec playwright test e2e/editor.spec.ts -g "phone photo|security baseline"
          fi

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          # Installers, update packages, blockmaps (differential updates) and the update manifests.
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.blockmap' -o -name 'latest*.yml' -o -name 'beta*.yml' \) \
            -exec cp {} release/ \;
          ls -l release
          # The update manifests, for the record (file names, sizes and SHA-512 that updaters check).
          cat release/*.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-editor-${{ matrix.name }}
          path: image-editor/app/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/image-editor-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-editor-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Draft the release with every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release-please release may already exist for the tag: add the files to it and keep it a draft;
          # otherwise create the draft. Publishing is a maintainer's step, after release QA.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft \
              --title "ImageEditor ${GITHUB_REF_NAME#image-editor-v}" \
              --notes "See image-editor/CHANGELOG.md. Publish after the release QA checklist (image-editor/docs/07-testing-strategy.md §8)."
          fi
