name: winrar-ci

on:
  pull_request:
    paths: ['winrar-clone/**', '.github/workflows/winrar-ci.yml']
  push:
    branches: [master, main, 'claude/**']
    paths: ['winrar-clone/**', '.github/workflows/winrar-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winrar-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: winrar-clone/app

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      # Unit/integration tests and the Vite build don't need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: winrar-clone/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: winrar-clone/app/.nvmrc
          cache: pnpm
          cache-dependency-path: winrar-clone/app/pnpm-lock.yaml
      - name: Install (also fetches and verifies the pinned 7-Zip)
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: e2e (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      # Unsigned local package; signing/notarization happen only in the release workflow.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: winrar-clone/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: winrar-clone/app/.nvmrc
          cache: pnpm
          cache-dependency-path: winrar-clone/app/pnpm-lock.yaml
      - name: Allow Chromium's sandbox on Ubuntu 24.04 (AppArmor restricts unprivileged user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - name: Build and package (electron-builder --dir)
        run: pnpm pack:dir
      - name: E2E against the built app (dev layout)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pnpm exec playwright test; else pnpm exec playwright test; fi
      - name: E2E against the packaged app
        shell: bash
        env:
          E2E_TARGET: packaged
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pnpm exec playwright test; else pnpm exec playwright test; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            winrar-clone/app/test-results/
            winrar-clone/app/playwright-report/
          retention-days: 14
