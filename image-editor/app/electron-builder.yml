# Packaging config (docs/08 §2). Product name/appId are placeholders until the rename (docs/01 Q1).
appId: com.georgekibe.imageeditor
productName: ImageEditor
copyright: Copyright © 2026 George Kibe
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# sharp's native addon and the libvips shared libraries must live outside the asar archive.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
fileAssociations:
  - ext: [png, jpg, jpeg, webp, avif, gif, bmp, tif, tiff]
    name: Image
    role: Editor
    rank: Alternate
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  # No spaces: GitHub renames uploaded files with spaces, and latest.yml must name the asset exactly.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
mac:
  category: public.app-category.graphics-design
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [x64, arm64]
    # Squirrel.Mac installs updates from the zip (latest-mac.yml lists it); the dmg is for first installs.
    - target: zip
      arch: [x64, arm64]
linux:
  category: Graphics
  # deb/rpm need a maintainer; without it electron-builder asks for an author e-mail in package.json.
  maintainer: George Kibe
  target: [AppImage, deb, rpm]
  mimeTypes: [image/png, image/jpeg, image/webp, image/avif, image/gif, image/bmp, image/tiff]
# Releases live in this monorepo next to the other products', tagged per component by release-please, so
# electron-builder uploads to `image-editor-v<version>` and the app finds its own release through the
# GitHub API (main/services/release-feed.ts, ADR-0010). Keep owner/repo/prefix in sync with RELEASE_SOURCE.
publish:
  provider: github
  owner: George-Kibe
  repo: electronjs
  tagNamePrefix: image-editor-v
  releaseType: draft
